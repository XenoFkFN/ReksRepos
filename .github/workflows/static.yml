name: Update AltStore Repository

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger button via GitHub UI

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Scraping Dependencies
        run: |
          pip install requests beautifulsoup4 packaging

      - name: Execute Aggregator Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python update_repo.py

      - name: Configure Static Pages Deployment
        uses: actions/configure-pages@v5

      - name: Upload Output Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy Compiled JSON to GitHub Pages
        uses: actions/deploy-pages@v4
